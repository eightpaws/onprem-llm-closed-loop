# Закрытый контур: сеть internal не имеет маршрута наружу.
# Образы и веса должны быть загружены заранее, на машине с доступом.
services:
  ollama:
    image: ollama/ollama:0.40.16
    container_name: closed-ollama
    restart: unless-stopped
    environment:
      OLLAMA_NOPRUNE: "1"
      OLLAMA_NOHISTORY: "1"
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_DEBUG: "0"
    volumes:
      - ${MODELS_DIR:-./ollama}:/root/.ollama
    networks: [closed]
    ports:
      - "127.0.0.1:11434:11434"      # только с этой машины, не в локальную сеть

  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llamacpp
      args:
        CUDA_ARCH: "70"              # Volta: без этого флага сборка не стартует на sm_70
    container_name: closed-llamacpp
    restart: unless-stopped
    command: >
      --model /models/${GGUF_FILE:-model.gguf}
      --host 0.0.0.0 --port 8080
      --ctx-size ${CTX_SIZE:-32768}
      --batch-size 2048 --ubatch-size 512
      --cache-type-k q8_0 --cache-type-v q8_0
      --flash-attn --metrics
    volumes:
      - ${GGUF_DIR:-./models}:/models:ro
    networks: [closed]
    ports:
      - "127.0.0.1:8080:8080"

networks:
  closed:
    driver: bridge
    internal: true                   # ключевая строка: нет маршрута наружу
